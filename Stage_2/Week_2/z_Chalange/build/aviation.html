<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="modals.css">
<link rel="stylesheet" href="responsive.css">

<body id="generalBody">
    <header id="header">
        <div>
            <span href="" id="planeLogo" onclick="listOptions()">🛫</span>
            <h1>Aviation Tracker</h1>
            <button id="menuToggle" aria-label="Open menu">☰</button>
            <div id="headerActions">
                <a href="" id="donate" onclick="showDonateModal()">Donate</a>
                <span id="call" onclick="showCallModal()">📞</span>
            </div>
        </div>
        <div id="mobileMenu">
            <a href="" id="donateMobile" onclick="showDonateModal()">Donate</a>
            <span id="callMobile" onclick="showCallModal()">📞</span>
        </div>
    </header>

    <span id="currentTime">Next....</span>

    <section id="mainBodyContent">
        <img src="images/travel.png" alt="" id="image">
        <section id="flightinfno">
            <button id="currentFlights">What is happening?</button>
            <h3>Arrival time</h3>
            <span id="arrivalToLocation">.</span>
            <span id="arrivalFlightDate">.</span>
            <span id="arrivalFlightName">.</span>
            <span id="arrivalFlightNumber">.</span>
            <span id="arrivalIate">.</span>
            <span id="arrivalIcao">.</span>
            <span id="arrivalTimeZone">.</span>
            <span id="arrivalAirlineName">.</span>

            <h3>Depature time</h3>
            <span id="depatureToLocation">.</span>
            <span id="depatureFlightDate">.</span>
            <span id="depatureFlightName">.</span>
            <span id="depatureFlightNumber">.</span>
            <span id="depatureIate">.</span>
            <span id="depatureIcao">.</span>
            <span id="depatureTimeZone">.</span>
            <span id="depatureAirlineName">.</span>
        </section>
    </section>

    <section>
        <footer>

        </footer>
    </section>

    <script src="js/main.js"></script>
    <script src="js/aviationModals.js"></script>
    <script src="js/donateModal.js"></script>
    <script src="js/callModal.js"></script>
    <!-- <script src="js/searchModal.js"></script> -->
</body>

</html>
